name: iOS - Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Get pub dependencies
        run: flutter pub get
        shell: bash

      - name: Ensure ios/Podfile has platform :ios, '13.0' (if missing)
        run: |
          if [ -f ios/Podfile ]; then
            if ! grep -q "platform :ios" ios/Podfile; then
              printf "%s\n" "platform :ios, '13.0'" | cat - ios/Podfile > /tmp/Podfile && mv /tmp/Podfile ios/Podfile
              echo "Inserted platform line into ios/Podfile"
            else
              echo "Podfile already contains platform entry"
            fi
          else
            echo "No ios/Podfile file found; continuing (flutter will create/update Podfile)"
          fi
        shell: bash

      - name: Ensure ios/Flutter/Generated.xcconfig exists
        run: |
          mkdir -p ios/Flutter
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "# Placeholder generated by CI to allow 'pod install' to run. Flutter build will update this file." > ios/Flutter/Generated.xcconfig
            echo "Created ios/Flutter/Generated.xcconfig"
          else
            echo "ios/Flutter/Generated.xcconfig already present"
          fi
        shell: bash

      - name: Patch Xcode project (disable signing)
        run: |
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "Patching Xcode project to disable DEVELOPMENT_TEAM..."
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/' ios/Runner.xcodeproj/project.pbxproj
            echo "Patched DEVELOPMENT_TEAM to empty string"
          else
            echo "Runner.xcodeproj not found!"
          fi
        shell: bash

      - name: Build iOS app (release, no codesign)
        run: flutter build ios --release --no-codesign
        shell: bash

      - name: Package unsigned IPA
        run: |
          set -e
          IOS_BUILD_DIR=build/ios/iphoneos
          if [ ! -d "$IOS_BUILD_DIR/Runner.app" ]; then
            echo "ERROR: Runner.app not found in $IOS_BUILD_DIR"
            ls -la build/ios || true
            exit 1
          fi
          cd $IOS_BUILD_DIR
          rm -f FlutterApp.ipa || true
          rm -rf Payload || true
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r FlutterApp.ipa Payload
          ls -lh FlutterApp.ipa
        shell: bash

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterApp-unsigned-ipa
          path: build/ios/iphoneos/FlutterApp.ipa
