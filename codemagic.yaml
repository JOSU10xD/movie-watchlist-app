workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build iOS (unsigned for simulator)
        script: |
          flutter build ios --simulator --release

      - name: Package .app into .ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r build/ios/ipa/Runner-unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/ipa/*.ipa
